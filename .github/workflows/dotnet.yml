name: .NET

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DALAMUD_HOME: ${{ github.workspace }}\.dalamud\dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud staging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path .dalamud | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile .dalamud/latest.zip
          Expand-Archive -Force .dalamud/latest.zip .dalamud/dev

      - name: Restore dependencies
        run: dotnet restore Uriangenio.sln -r win-x64

      - name: Build
        run: dotnet build Uriangenio.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Uriangenio.sln --configuration Release --no-build --verbosity normal
